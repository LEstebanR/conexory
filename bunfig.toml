[test]
preload = ["./test-setup.ts"]
# Coverage thresholds apply when running bun test --coverage (enforced in CI).
# Bun only reports files actually executed during the test run, so the
# threshold measures quality across the files that have tests.
coverageThreshold = 0.80
# createPreapproval/getPreapproval/getPayment/cancelPreapproval (the real
# Mercado Pago HTTP calls) can't be unit tested alongside the mocks of the
# same module in lib/subscription.test.ts and the webhook route tests —
# bun:test's mock.module() replaces modules process-wide, not per file (see
# LES-263, the same issue that applied to lib/wompi.ts before this migration).
# Excluded here rather than left permanently failing the threshold.
coveragePathIgnorePatterns = ["**/lib/mercadopago.ts"]
