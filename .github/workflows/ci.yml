name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # shell: bash adds pipefail, so tee doesn't mask a failing run.
      - shell: bash
        run: bun run test --reporter=junit --reporter-outfile="$RUNNER_TEMP/test-order.xml" 2>&1 | tee "$RUNNER_TEMP/test-run.log"
      # bun:test runs every file in one process, so a leaked mock.module() only
      # breaks a later file. Re-running in reverse of Bun's own file order and in
      # a random order catches tests that depend on which file runs first.
      - name: Test in reverse file order
        run: |
          set -f
          files=$(grep -oE '<testsuite name="[^"]+\.test\.tsx?"' "$RUNNER_TEMP/test-order.xml" \
            | sed -E 's/^<testsuite name="/.\//; s/"$//' | sed -n '1!G;h;$p')
          expected=$(grep -oE 'across [0-9]+ files?' "$RUNNER_TEMP/test-run.log" | grep -oE '[0-9]+')
          actual=$(printf '%s\n' $files | grep -c .)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Reverse run would cover $actual files, but the first run covered $expected"
            exit 1
          fi
          bun test $files
      - name: Test in random order (reproduce with the printed --seed)
        run: bun run test --randomize

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run coverage

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conexory_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conexory_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/conexory_e2e
      # Throwaway — signs sessions in the ephemeral Postgres container above.
      BETTER_AUTH_SECRET: e2e-ci-only-throwaway-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx prisma migrate deploy
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
