name: Validate branch name

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  check-branch-name:
    name: Check branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name format
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feat|fix|refactor|chore|docs)\/(LES-[0-9]+-[a-z0-9-]+|[a-z0-9-]+)$"

          if [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "✅ Branch name is valid: $BRANCH"
          else
            echo "❌ Invalid branch name: $BRANCH"
            echo ""
            echo "Expected format:"
            echo "  {type}/LES-{number}-{short-description}   (issue en Linear)"
            echo "  {type}/{short-description}                (issue en GitHub, sin número — usa 'Closes #N' en el PR)"
            echo "Examples:"
            echo "  feat/LES-149-plan-pro-subscriptions"
            echo "  fix/LES-155-zod-validation-actions"
            echo "  chore/migrate-mercadopago"
            echo ""
            echo "Valid types: feat, fix, refactor, chore, docs"
            exit 1
          fi
